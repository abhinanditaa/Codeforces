name: Codeforces Sync

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync Codeforces submissions
        env:
          CODEFORCES_HANDLE: ${{ secrets.CODEFORCES_HANDLE }}
        run: |
          python sync_codeforces.py

      - name: Commit new solutions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add solutions/

          if git diff --cached --quiet; then
            echo "No new solutions to commit."
          else
            git commit -m "Auto-sync Codeforces solutions"
            git push
          fi
